name: Sync frontend to team-17

on:
  # Normalize Git authors runs on every push. Its token-based rewrite does
  # not trigger another push workflow, so sync after it has completed.
  workflow_run:
    workflows: ['Normalize Git authors']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-team-17
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test team author selection and push retries
        run: python3 -B .github/scripts/test_sync_author.py -v

      - name: Sync committed files over HTTPS
        env:
          HACKATHON_USERNAME: ${{ secrets.HACKATHON_USERNAME }}
          HACKATHON_TOKEN: ${{ secrets.HACKATHON_TOKEN }}
          SYNC_SUBDIRECTORY: frontend
        run: bash .github/scripts/sync-team-17.sh
